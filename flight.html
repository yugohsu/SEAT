<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="航班小幫手">
<meta name="theme-color" content="#1d4ed8">
<title>✈️ 航班小幫手</title>
<style>
:root{
  --primary:#1d4ed8; --bg:#eef2f7; --card:#ffffff; --text:#0f172a; --muted:#475569;
  --border:#dbe3ee; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --soft:#eff6ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--text); font-size:19px; line-height:1.55;
  padding:14px 14px 40px;
}
.wrap{max-width:640px;margin:0 auto;}
h1{font-size:28px;margin:4px 0 14px;font-weight:900;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.06);}
.card h2{font-size:23px;margin:0 0 10px;font-weight:900;}
label{display:block;font-weight:800;font-size:18px;margin:8px 0 6px;}
input,select{
  width:100%;font-size:24px;font-weight:800;padding:14px;border:2px solid var(--border);
  border-radius:12px;background:#fff;color:var(--text);font-family:inherit;
}
input#flightNo{text-transform:uppercase;letter-spacing:2px;}
button{font-family:inherit;border:none;border-radius:14px;font-weight:900;cursor:pointer;color:#fff;}
#searchBtn{width:100%;background:var(--primary);font-size:30px;padding:20px;margin-top:14px;}
#searchBtn:disabled{background:#94a3b8;}
.btn2{background:#0f766e;font-size:20px;padding:14px 18px;width:100%;margin-top:10px;}
.btn3{background:#e2e8f0;color:var(--text);font-size:18px;padding:12px 16px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* 航班大卡 */
.big-status{font-size:30px;font-weight:900;margin:2px 0 8px;}
.st-ok{color:var(--ok);} .st-warn{color:var(--warn);} .st-bad{color:var(--bad);}
.route{font-size:24px;font-weight:900;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.kv div{background:var(--soft);border-radius:12px;padding:10px 12px;}
.kv .k{font-size:16px;color:var(--muted);font-weight:800;}
.kv .v{font-size:28px;font-weight:900;line-height:1.2;}
.kv .v.small{font-size:21px;}
.note{font-size:17px;color:var(--muted);font-weight:700;margin-top:8px;}
.alert{background:#fff7ed;border:2px solid #fdba74;color:#7c2d12;border-radius:12px;padding:12px;font-weight:800;}
.alert.blue{background:#eff6ff;border-color:#93c5fd;color:#1e3a8a;}
.alert.red{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d;}

/* 清單 */
ul.list{list-style:none;margin:0;padding:0;}
ul.list li{padding:10px 0;border-bottom:1px dashed var(--border);font-size:19px;}
ul.list li:last-child{border-bottom:none;}
ul.list b{font-weight:900;}
.tag{display:inline-block;font-size:14px;font-weight:900;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle;}
.tag.off{background:#dcfce7;color:#166534;}
.tag.none{background:#f1f5f9;color:#475569;}
a.link{display:block;background:#f1f5f9;color:var(--primary);text-decoration:none;font-weight:900;font-size:19px;padding:12px 14px;border-radius:12px;margin-top:8px;}
.line-box{white-space:pre-wrap;background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:12px;font-size:19px;font-weight:700;}
details summary{font-weight:900;font-size:20px;cursor:pointer;}
.hidden{display:none;}
.src{font-size:15px;color:var(--muted);margin-top:10px;word-break:break-all;}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ 航班小幫手</h1>

  <!-- 查詢 -->
  <div class="card">
    <div class="row2">
      <div>
        <label for="flightNo">航班號</label>
        <input id="flightNo" placeholder="JX850" autocomplete="off" inputmode="text">
      </div>
      <div>
        <label for="flightDate">日期</label>
        <input id="flightDate" type="date">
      </div>
    </div>
    <label for="destSel">日本機場（查到航班會自動帶入）</label>
    <select id="destSel"></select>
    <button id="searchBtn" onclick="search()">🔍 查詢</button>
  </div>

  <div id="result"></div>

  <!-- 設定 -->
  <div class="card">
    <details id="settingsBox">
      <summary>⚙️ 設定</summary>
      <label for="apiUrl">即時資料網址（Google Apps Script）</label>
      <input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:16px;">
      <label for="gatherMin">集合時間：起飛前幾分鐘</label>
      <select id="gatherMin">
        <option value="150">2 小時 30 分</option>
        <option value="180" selected>3 小時</option>
        <option value="210">3 小時 30 分</option>
      </select>
      <button class="btn2" onclick="saveSettings()">💾 儲存設定</button>
    </details>
  </div>
</div>

<script>
/* ====== 若要寫死網址，填在這裡（設定裡填的會優先） ====== */
const DEFAULT_API = '';

/* ====== 航空公司 ====== */
const AIRLINES = {
  CI:{name:'中華航空', icao:'CAL', close:'起飛前 60 分鐘關櫃', site:'https://www.china-airlines.com/'},
  BR:{name:'長榮航空', icao:'EVA', close:'亞洲線起飛前 2.5 小時開櫃、1 小時關櫃', site:'https://www.evaair.com/'},
  JX:{name:'星宇航空', icao:'SJX', close:'開關櫃時間請以星宇官網為準', site:'https://www.starlux-airlines.com/'},
  IT:{name:'台灣虎航', icao:'TTW', close:'開關櫃時間請以虎航官網為準', site:'https://www.tigerairtw.com/'},
  MM:{name:'樂桃航空', icao:'APJ', close:'開關櫃時間請以樂桃官網為準', site:'https://www.flypeach.com/'}
};

/* ====== 桃園機場（資料來源：桃園機場官網設施資料 2026/10/21 查證） ====== */
const TPE = {
  scale: '桃園機場官網沒有公布電子秤位置。請在航空公司報到櫃台請地勤協助秤重；需要打包可到宅配通櫃台。',
  T1: {
    hall: '第一航廈 報到大廳在 1F',
    items: [
      ['報到大廳服務台','1F（非管制區）24 小時'],
      ['宅配通（行李寄存、打包）','1F（非管制區）24 小時'],
      ['出發前換匯','臺灣銀行 1F 05:00–21:20、兆豐銀行 1F 05:30–22:00（非管制區）'],
      ['網卡 / eSIM 取件','飛買家 ezfly 3F 05:30–21:00、游客邦 1F 04:30–23:00、中華電信 1F、台灣大哥大 1F、遠傳 1F'],
      ['哺（集）乳室','出境後管制區 2F、3F、4F 都有'],
      ['醫療中心','B1（非管制區）08:30–20:30；出境後 3F 08:30–17:00']
    ]
  },
  T2: {
    hall: '第二航廈 報到大廳在 3F',
    items: [
      ['報到大廳服務台','3F（非管制區）24 小時'],
      ['宅配通（行李寄存、打包）','3F（非管制區）06:00–23:30；1F 24 小時'],
      ['出發前換匯','臺灣銀行 3F 05:30–22:20、兆豐銀行 3F 05:30–22:50（非管制區）'],
      ['網卡 / eSIM 取件','飛買家 ezfly 3F 05:30–23:00、中華電信 3F 08:00–19:00（1F 另有多家）'],
      ['哺（集）乳室','出境後管制區 2F、3F、4F 都有'],
      ['醫療中心','1F（非管制區）08:30–20:30；出境後 3F 08:30–17:00']
    ]
  },
  airlineCounter: {},
  links: [
    ['桃園機場 客機起飛','https://www.taoyuan-airport.com/flight_depart'],
    ['桃園機場 客機抵達','https://www.taoyuan-airport.com/flight_arrival'],
    ['桃園機場 設施與服務','https://www.taoyuan-airport.com/services_facilities']
  ]
};

/* ====== 日本機場（各機場官網 2026/10/21 查證；沒查到的不寫） ====== */
const JP = {
  NRT:{name:'成田機場', terminal:{BR:'第 1 航廈',CI:'第 2 航廈',JX:'第 2 航廈',IT:'第 2 航廈',MM:'第 1 航廈'},
    termNote:'航廈依成田機場官網「航空公司一覽」',
    scale:{has:false, text:'成田機場官網沒有公布電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[],
    links:[['成田 出發航班','https://www.narita-airport.jp/ja/flight/dep-search/'],['成田 抵達航班','https://www.narita-airport.jp/ja/flight/arr-search/'],['成田 機場地圖（含哺乳室、報到櫃台）','https://www.narita-airport.jp/ja/map/']]},
  HND:{name:'羽田機場', terminal:{'*':'第 3 航廈（國際線）'},
    termNote:'國際線出發樓層在 3F（羽田機場官網）',
    scale:{has:false, text:'羽田機場官網沒有公布電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[['嬰兒車借用（機場內使用）','見羽田官網「ベビーカー貸し出し」']],
    links:[['羽田 國際線航班','https://tokyo-haneda.com/flight/flightInfo_int.html'],['羽田 第 3 航廈樓層地圖','https://tokyo-haneda.com/floor/floor-guide.html?area=9&tab=terminal3'],['羽田 嬰兒車借用','https://tokyo-haneda.com/text/service/facilities/stroller_rentals.html']]},
  KIX:{name:'關西機場', terminal:{'*':'第 1 航廈（以機場螢幕為準）'},
    termNote:'',
    scale:{has:false, text:'關西機場官網沒有公布電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[],
    links:[['關西 今日出發航班','https://www.kansai-airport.or.jp/flight/search?direction=DEP'],['關西 今日抵達航班','https://www.kansai-airport.or.jp/flight/search?direction=ARR'],['關西 機場地圖','https://www.kansai-airport.or.jp/map'],['關西 兒童遊戲區','https://www.kansai-airport.or.jp/service/child/kidscorner']]},
  CTS:{name:'新千歲機場', terminal:{'*':'國際線航廈'},
    termNote:'',
    scale:{has:true, text:'✅ 國際線航廈 3F 有「床置式行李秤」，任何人都能免費使用（官方說明：結果僅供參考，以航空公司秤重為準）。3F 也有行李整理區。'},
    items:[],
    links:[['新千歲 電子秤官方頁','https://www.hokkaido-airports.com/ja/new-chitose/service/baggage/baggage-scales/'],['新千歲 電子秤位置地圖（國際線 3F）','https://www.hokkaido-airports.com/ja/new-chitose/floormap/international/?category=baggage-scales&floor=3F'],['新千歲 今日航班','https://www.hokkaido-airports.com/ja/new-chitose/airport/fis/?initial'],['新千歲 國際線出發流程','https://www.hokkaido-airports.com/ja/new-chitose/airport/inter/departure-step/']]},
  FUK:{name:'福岡機場', terminal:{'*':'國際線航廈'},
    termNote:'',
    scale:{has:false, text:'福岡機場官網沒有找到電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[],
    links:[['福岡 航班查詢','https://www.fukuoka-airport.jp/flight/'],['福岡 國際線樓層地圖','https://www.fukuoka-airport.jp/map/index.html?floor_id=int'],['福岡 國際線搭機流程','https://www.fukuoka-airport.jp/flight/flow_int/index.html']]},
  NGO:{name:'中部機場', terminal:{'*':'第 1 航廈'},
    termNote:'中華航空：第 1 航廈 H 櫃台，起飛前 2 小時 30 分開始報到（中部機場官網）',
    scale:{has:false, text:'中部機場官網沒有公布電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[],
    links:[['中部機場（繁中）','https://www.centrair.jp/tzh/'],['中部 中華航空資訊','https://www.centrair.jp/tzh/flight/airline/china-airlines.html']]},
  OKA:{name:'那霸機場', terminal:{'*':'國際線'},
    termNote:'',
    scale:{has:false, text:'那霸機場官網沒有找到電子秤位置，請在報到櫃台請地勤秤重。'},
    items:[],
    links:[['那霸 今日國際線航班','https://www.naha-airport.co.jp/flight/today?I_type=DEPARTED'],['那霸 樓層地圖','https://www.naha-airport.co.jp/spend/map/']]}
};
const PLACE_TO_JP = {NRT:'NRT',HND:'HND',KIX:'KIX',CTS:'CTS',FUK:'FUK',NGO:'NGO',OKA:'OKA'};

/* ====== 搭機規定（2026/10/21 查證） ====== */
const RULES = [
  ['🔋 行動電源','每人最多 2 個，只能放隨身行李，不能託運。機上不能幫行動電源充電，也不能用它幫手機充電。100Wh 以上需航空公司同意，超過 160Wh 禁止。'],
  ['💧 隨身液體','每瓶 100ml 以下，全部裝進 1 公升以內的透明夾鏈袋。'],
  ['🧳 託運行李','件數和重量依機票艙等不同，請看電子機票上的行李額度。']
];

/* ====== 工具 ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function todayStr(){
  const d = new Date(Date.now() + (8*60 + new Date().getTimezoneOffset())*60000); // 台灣時間
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function mdText(dateStr){ const p = dateStr.split(/[-/]/); return parseInt(p[1],10)+'/'+parseInt(p[2],10); }
function subMinutes(hhmm, min){
  const [h,m] = hhmm.split(':').map(Number);
  let t = h*60 + m - min; t = ((t % 1440) + 1440) % 1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function apiUrl(){ return (load('fh_api') || DEFAULT_API || '').trim(); }

/* ====== 初始化 ====== */
(function init(){
  const sel = $('destSel');
  sel.innerHTML = '<option value="">（自動判斷／不選）</option>' +
    Object.keys(JP).map(k => `<option value="${k}">${JP[k].name}（${k}）</option>`).join('');
  $('flightDate').value = todayStr();
  $('apiUrl').value = load('fh_api') || DEFAULT_API;
  const g = load('fh_gather'); if(g) $('gatherMin').value = g;
  const lastF = load('fh_last'); if(lastF) $('flightNo').value = lastF;
  $('flightNo').addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
  if(!apiUrl()) $('settingsBox').open = true;
})();

function saveSettings(){
  store('fh_api', $('apiUrl').value.trim());
  store('fh_gather', $('gatherMin').value);
  alert('✅ 已儲存');
}

/* ====== 查詢 ====== */
async function search(){
  const flight = $('flightNo').value.toUpperCase().replace(/\s+/g,'');
  const date = $('flightDate').value;
  const m = flight.match(/^([A-Z0-9]{2})(\d{1,4})$/);
  if(!m){ $('result').innerHTML = `<div class="card"><div class="alert red">請輸入正確航班號，例如 JX850</div></div>`; return; }
  store('fh_last', flight);
  const airline = m[1];
  const btn = $('searchBtn');
  btn.disabled = true; btn.innerText = '⏳ 查詢中…';

  let data = null, err = '';
  const api = apiUrl();
  if(api){
    try{
      const url = api + (api.includes('?') ? '&' : '?') + 'flight=' + encodeURIComponent(flight);
      const r = await fetch(url, {cache:'no-store'});
      data = await r.json();
      if(!data.ok) err = data.error || '查詢失敗';
    }catch(e){ err = '連不到即時資料，請檢查網路或設定的網址。'; }
  }
  btn.disabled = false; btn.innerText = '🔍 查詢';
  render(flight, airline, date, data, err, !api);
}

/* ====== 顯示 ====== */
function render(flight, airline, date, data, err, noApi){
  const dateSlash = date.replace(/-/g,'/');
  const al = AIRLINES[airline] || {name:airline, icao:'', close:'開關櫃時間請看航空公司官網', site:''};
  let html = '';
  let depRow = null, arrRow = null;

  if(noApi){
    html += `<div class="card"><div class="alert blue">還沒設定即時資料網址，所以目前只顯示機場與規定資訊。<br>到最下面「⚙️ 設定」貼上 Google Apps Script 網址，就能看到即時櫃台、登機門、轉盤。</div></div>`;
  }else if(err){
    html += `<div class="card"><div class="alert red">⚠️ ${esc(err)}</div></div>`;
  }else if(data){
    const rows = data.rows.filter(r => r.schedDate === dateSlash);
    depRow = rows.find(r => r.type === 'D') || null;
    arrRow = rows.find(r => r.type === 'A') || null;
    const avail = data.availableDates || [];
    if(!rows.length){
      const inRange = avail.includes(dateSlash);
      html += `<div class="card"><div class="alert">` + (inRange
        ? `桃園機場 ${mdText(dateSlash)} 沒有 ${esc(flight)} 這班（可能不是桃園出發／抵達，或航班號打錯）。`
        : `桃園機場官方即時資料目前只有 ${avail.map(mdText).join('、')}。<br>${mdText(dateSlash)} 的資料會在<b>前一天</b>出現，到時再查一次。`) +
        `</div></div>`;
    }
    if(depRow) html += flightCard(depRow, 'D', al);
    if(arrRow) html += flightCard(arrRow, 'A', al);
    if(depRow || arrRow) html += `<div class="src">資料來源：桃園機場官方即時航班檔，查詢時間 ${esc(data.fetchedAt)}</div>`;
  }

  // 決定日本機場
  let jpKey = $('destSel').value;
  const place = (depRow && depRow.place) || (arrRow && arrRow.place) || '';
  if(PLACE_TO_JP[place]){ jpKey = PLACE_TO_JP[place]; $('destSel').value = jpKey; }

  // LINE 公告
  if(depRow) html += lineCard(depRow, al);

  // 桃園機場
  const term = depRow ? depRow.terminal : (arrRow ? arrRow.terminal : '');
  html += tpeCard(term, airline);

  // 日本機場
  if(jpKey) html += jpCard(jpKey, airline);
  else html += `<div class="card"><h2>🇯🇵 日本機場</h2><div class="note">上面選日本機場，就會顯示那邊的資訊。</div></div>`;

  // 規定
  html += rulesCard(al);

  // 其他連結
  html += `<div class="card"><h2>🔗 其他查詢</h2>` +
    (al.icao ? `<a class="link" target="_blank" rel="noopener" href="https://www.flightaware.com/live/flight/${al.icao}${parseInt(flight.slice(2),10)}">FlightAware 即時航跡（${esc(flight)}）</a>` : '') +
    (al.site ? `<a class="link" target="_blank" rel="noopener" href="${al.site}">${esc(al.name)} 官網</a>` : '') +
    `</div>`;

  $('result').innerHTML = html;
  window.scrollTo({top: $('result').offsetTop - 10, behavior:'smooth'});
}

function statusClass(s){
  if(/延|更改|變更/.test(s)) return 'st-warn';
  if(/取消/.test(s)) return 'st-bad';
  return 'st-ok';
}

function flightCard(r, type, al){
  const isDep = type === 'D';
  const termText = r.terminal === '1' ? '第一航廈 T1' : (r.terminal === '2' ? '第二航廈 T2' : '—');
  const changed = r.estTime && r.estTime !== r.schedTime;
  const cells = isDep ? [
      ['報到櫃台', r.counter ? r.counter + ' 號' : '未公布'],
      ['登機門', r.gate || '未公布'],
      ['航廈', termText, true],
      ['機型', r.aircraft || '未公布', true]
    ] : [
      ['行李轉盤', r.carousel ? parseInt(r.carousel,10) + ' 號' : '未公布'],
      ['抵達門', r.gate || '未公布'],
      ['航廈', termText, true],
      ['機型', r.aircraft || '未公布', true]
    ];
  return `<div class="card">
    <h2>${isDep ? '🛫 桃園出發' : '🛬 抵達桃園'}　${esc(r.flightNo)}</h2>
    <div class="big-status ${statusClass(r.status)}">${esc(r.status)}</div>
    <div class="route">${isDep ? '桃園 → ' + esc(r.placeZh) : esc(r.placeZh) + ' → 桃園'}</div>
    <div class="note">${esc(al.name)}｜表定 ${esc(r.schedTime)}${changed ? '　<b style="color:#b45309">預計 ' + esc(r.estTime) + '</b>' : ''}</div>
    <div class="kv">${cells.map(c => `<div><div class="k">${c[0]}</div><div class="v${c[2]?' small':''}">${esc(c[1])}</div></div>`).join('')}</div>
    ${isDep && !r.gate ? '<div class="note">登機門通常在起飛當天才公布。</div>' : ''}
  </div>`;
}

function lineCard(r, al){
  const gather = subMinutes(r.schedTime, parseInt($('gatherMin').value,10));
  const termText = r.terminal === '1' ? '第一航廈' : '第二航廈';
  let t = `✈️ 航班提醒 ${r.flightNo}（${mdText(r.schedDate)}）\n`;
  t += `🛫 桃園${termText} → ${r.placeZh}\n`;
  t += `⏰ 起飛 ${r.schedTime}${r.estTime && r.estTime !== r.schedTime ? '（預計 ' + r.estTime + '）' : ''}　${r.status}\n`;
  t += `👥 集合時間 ${gather}\n`;
  t += `📍 集合地點 ${termText}${r.counter ? ' 報到櫃台 ' + r.counter + ' 號' : ' 報到大廳'}\n`;
  if(r.gate) t += `🚪 登機門 ${r.gate}\n`;
  t += `🔋 行動電源每人最多 2 個，只能放隨身行李\n`;
  t += `💧 隨身液體每瓶 100ml 以下`;
  window.__lineText = t;
  return `<div class="card"><h2>📣 LINE 群組公告</h2>
    <div class="line-box">${esc(t)}</div>
    <button class="btn2" onclick="copyLine(this)">📋 複製公告</button></div>`;
}

function copyLine(btn){
  const text = window.__lineText || '';
  const ok = () => { btn.innerText = '✅ 已複製'; setTimeout(() => btn.innerText = '📋 複製公告', 2000); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy') ? ok() : alert('請長按文字手動複製'); }catch(e){ alert('請長按文字手動複製'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(fallback);
  else fallback();
}

function tpeCard(term, airline){
  const terms = term ? ['T' + term] : ['T1','T2'];
  let h = `<div class="card"><h2>🇹🇼 桃園機場</h2>`;
  h += `<div class="alert" style="margin-bottom:10px;">⚖️ 電子秤：${esc(TPE.scale)}</div>`;
  if(TPE.airlineCounter[airline]) h += `<div class="note" style="margin-bottom:8px;">🧾 ${esc(TPE.airlineCounter[airline])}</div>`;
  terms.forEach(t => {
    const d = TPE[t];
    h += `<h2 style="font-size:21px;margin-top:10px;">${esc(d.hall)}</h2><ul class="list">` +
      d.items.map(i => `<li><b>${esc(i[0])}</b><br>${esc(i[1])}</li>`).join('') + `</ul>`;
  });
  if(!term) h += `<div class="note">查到航班後只會顯示該航廈。</div>`;
  h += TPE.links.map(l => `<a class="link" target="_blank" rel="noopener" href="${l[1]}">${esc(l[0])}</a>`).join('');
  h += `<div class="src">資料來源：桃園機場官網設施資料（2026/10/21 查證），營業時間可能調整。</div></div>`;
  return h;
}

function jpCard(key, airline){
  const a = JP[key];
  const term = a.terminal[airline] || a.terminal['*'] || '請看機場螢幕';
  let h = `<div class="card"><h2>🇯🇵 ${esc(a.name)}</h2>`;
  h += `<div class="kv" style="grid-template-columns:1fr;margin-top:0;"><div><div class="k">${esc((AIRLINES[airline]||{name:airline}).name)} 航廈</div><div class="v small">${esc(term)}</div></div></div>`;
  if(a.termNote) h += `<div class="note">${esc(a.termNote)}</div>`;
  h += `<div class="alert ${a.scale.has ? 'blue' : ''}" style="margin-top:10px;">⚖️ 電子秤：${esc(a.scale.text)}</div>`;
  if(a.items.length) h += `<ul class="list" style="margin-top:6px;">` + a.items.map(i => `<li><b>${esc(i[0])}</b><br>${esc(i[1])}</li>`).join('') + `</ul>`;
  h += `<div class="note">日本機場沒有免費的即時資料，櫃台、登機門、轉盤請點下面官方頁面查看。</div>`;
  h += a.links.map(l => `<a class="link" target="_blank" rel="noopener" href="${l[1]}">${esc(l[0])}</a>`).join('');
  h += `<div class="src">資料來源：${esc(a.name)}官網（2026/10/21 查證）</div></div>`;
  return h;
}

function rulesCard(al){
  return `<div class="card"><h2>📋 搭機規定</h2><ul class="list">` +
    `<li><b>🕐 報到櫃台</b><br>${esc(al.name)}：${esc(al.close)}</li>` +
    RULES.map(r => `<li><b>${esc(r[0])}</b><br>${esc(r[1])}</li>`).join('') +
    `</ul><div class="src">行動電源：日本國土交通省 2026/4/24 起新規定；台灣民航局依國際民航組織規範同樣限 2 個。</div></div>`;
}
</script>
