<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="領隊工具箱">
<title>領隊工具箱 - 小優</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e8; --card:#fffdf9; --ink:#1f2a37; --ink2:#334155; --muted:#9a8b76;
  --tan:#f1e5cf; --tan-ink:#7a5b2e; --line:#ece2d0;
  --ok-bg:#e4f1e6; --ok:#2f6b45; --warn-bg:#fdf0dc; --warn:#9a5b12; --bad-bg:#fbe5e3; --bad:#a3302a;
  --blue-bg:#e6edf7; --blue:#2c4a7a;
  --r:22px; --shadow:0 1px 2px rgba(60,40,10,.05), 0 6px 18px rgba(60,40,10,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink); font-size:18px; line-height:1.5; font-weight:700;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px;margin:0 auto;}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px;}
.top h1{font-size:28px;font-weight:900;margin:0;letter-spacing:1px;}
.top .sub{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px;}
.icon-btn{height:48px;padding:0 18px;font-family:inherit;font-weight:900;color:var(--ink);font-size:17px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}

/* 可收合卡片 */
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px;cursor:pointer;user-select:none;}
.sec-head h2{margin:0;font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px;}
.chev{width:44px;height:44px;border-radius:50%;background:var(--tan);color:var(--tan-ink);display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:transform .2s;}
.chev::before{content:"";width:10px;height:10px;border-right:3px solid var(--tan-ink);border-bottom:3px solid var(--tan-ink);transform:translateY(-3px) rotate(45deg);}
.sec.closed .chev{transform:rotate(-90deg);}
.sec-body{padding:0 18px 18px;}
.sec.closed .sec-body{display:none;}

/* 表單 */
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row input{min-width:0;}
#flightDate{font-size:18px;padding:13px 10px;}
.fl{font-size:15px;color:var(--muted);font-weight:900;margin:0 0 6px 4px;}
input,select,textarea{
  width:100%;font-family:inherit;font-size:22px;font-weight:900;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:#cdb68f;}
#flightNo{text-transform:uppercase;letter-spacing:1px;}
textarea{font-size:19px;line-height:1.6;resize:vertical;min-height:150px;}
select{font-size:17px;}
.btn{width:100%;border:none;border-radius:18px;background:var(--ink);color:#fff;font-family:inherit;font-weight:900;
  font-size:24px;padding:17px;margin-top:14px;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 12px rgba(31,42,55,.18);}
.btn:disabled{opacity:.55;}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn-s{flex:1;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-family:inherit;
  font-weight:900;font-size:18px;padding:12px;cursor:pointer;}
.btn-s:disabled{opacity:.4;}

/* 航班結果 */
.fcard{border-top:1.5px dashed var(--line);margin-top:18px;padding-top:16px;}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.f-title{font-size:22px;font-weight:900;}
.pill{display:inline-block;border-radius:999px;padding:5px 14px;font-size:17px;font-weight:900;}
.pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.info{background:var(--blue-bg);color:var(--blue);} .pill.warn{background:var(--warn-bg);color:var(--warn);} .pill.bad{background:var(--bad-bg);color:var(--bad);}
.route{font-size:26px;font-weight:900;margin:8px 0 2px;}
.ftime{font-size:17px;color:var(--ink2);}
.ftime b{color:var(--warn);}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.tile{background:var(--tan);border-radius:18px;padding:12px 14px;}
.tile .k{font-size:14px;color:var(--tan-ink);font-weight:900;opacity:.85;}
.tile .v{font-size:30px;font-weight:900;line-height:1.15;color:var(--ink);}
.tile .v.s{font-size:20px;}
.tile.hl{background:var(--ink);} .tile.hl .k{color:#d9c7a6;} .tile.hl .v{color:#fff;}

.note{font-size:16px;color:var(--muted);margin-top:10px;}
.msg{border-radius:16px;padding:12px 14px;font-size:17px;margin-top:14px;}
.msg.warn{background:var(--warn-bg);color:var(--warn);} .msg.bad{background:var(--bad-bg);color:var(--bad);} .msg.blue{background:var(--blue-bg);color:var(--blue);}

/* 資訊列 */
.info{margin-top:18px;}
.info h3{font-size:19px;font-weight:900;margin:0 0 6px 2px;display:flex;align-items:center;gap:8px;}
.rows{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:2px 14px;}
.r{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline;}
.r:last-child{border-bottom:none;}
.r .rk{flex:0 0 72px;font-size:15px;color:var(--muted);font-weight:900;}
.r .rv{flex:1;font-size:17px;}
.r .rv.good{color:var(--ok);}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.links a{background:var(--tan);color:var(--tan-ink);text-decoration:none;font-size:15px;font-weight:900;padding:8px 14px;border-radius:999px;}

/* 座位 */
.auto-info{margin-top:12px;background:var(--blue-bg);color:var(--blue);border-radius:16px;padding:10px 14px;font-size:17px;font-weight:900;}
.output-area{white-space:pre-wrap;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;font-size:19px;font-weight:900;margin-top:14px;min-height:60px;}
.status{border-radius:16px;padding:10px 14px;font-size:17px;margin-top:10px;white-space:pre-wrap;}
.status.ok{background:var(--ok-bg);color:var(--ok);} .status.warn{background:var(--bad-bg);color:var(--bad);}
.map-bar{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;}
.map-bar .t{font-size:19px;font-weight:900;}
.zoom{display:flex;gap:8px;}
.zoom button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:24px;font-weight:900;color:var(--ink);cursor:pointer;}
.seat-map-container{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;}
#seatMap{--s:52px;}
.seat-row{display:flex;align-items:center;margin-bottom:6px;min-width:max-content;}
.seat-block{display:flex;gap:5px;}
.aisle{width:calc(var(--s) * .7);display:flex;align-items:center;justify-content:center;font-weight:900;color:#c4b59c;font-size:calc(var(--s) * .28);}
.seat{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .22);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--s) * .3);font-weight:900;user-select:none;-webkit-user-select:none;transition:transform .1s;line-height:1.1;text-align:center;}
.valid-seat{background:var(--tan);color:var(--tan-ink);cursor:pointer;}
.invalid-seat{border:1.5px dashed #e4d9c6;color:#d6c9b2;font-size:calc(var(--s) * .22);}
.assigned{box-shadow:0 2px 5px rgba(0,0,0,.12);}
.seat.selected{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.08);}
.seat.dragging{opacity:.5;} .seat.over{outline:3px dashed #cdb68f;}
.seat.split{box-shadow:0 0 0 3px var(--bad) inset;}
.map-tip{font-size:15px;color:var(--muted);margin:8px 2px 0;}

/* 設定視窗 */
.modal{position:fixed;inset:0;background:rgba(31,42,55,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.modal.show{display:flex;}
.sheet{background:var(--bg);width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.sheet h2{margin:0 0 14px;font-size:24px;font-weight:900;}
.sheet .fl{margin-top:12px;}
.sheet input{font-size:16px;}
.ap-head{font-size:22px;font-weight:900;margin:4px 0 6px;}
.ap-area{font-size:19px;font-weight:900;margin:14px 0 2px;color:var(--tan-ink);}
.ap-order{font-size:16px;color:var(--ink2);margin:0 0 8px 2px;}
.muted{font-size:14px;color:var(--muted);}
.rv div+div{margin-top:4px;}
.ap-note{font-size:17px;min-height:70px;margin-top:2px;}
.chk{border-radius:12px;padding:8px 12px;font-size:15px;font-weight:900;margin:2px 0 4px;}
.chk.ok{background:var(--ok-bg);color:var(--ok);}
.chk.bad{background:var(--bad-bg);color:var(--bad);}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>領隊工具箱</h1>
      <div class="sub">航班即時資訊・座位分配</div>
    </div>
    <button class="icon-btn" onclick="openSettings()">設定</button>
  </div>

  <!-- ===== 航班 ===== -->
  <section class="sec" id="secFlight">
    <div class="sec-head" onclick="toggleSec('secFlight')">
      <h2>航班</h2><div class="chev"></div>
    </div>
    <div class="sec-body">
      <div class="field-row">
        <div><div class="fl">航班號</div><input id="flightNo" placeholder="JX850" autocomplete="off"></div>
        <div><div class="fl">日期</div><input id="flightDate" type="date"></div>
      </div>
      <button class="btn" id="searchBtn" onclick="searchFlight()">查詢</button>
      <div id="flightResult"></div>
    </div>
  </section>

  <!-- ===== 日本機場 ===== -->
  <section class="sec" id="secAirport">
    <div class="sec-head" onclick="toggleSec('secAirport')">
      <h2>日本機場</h2><div class="chev"></div>
    </div>
    <div class="sec-body">
      <div class="field-row">
        <div><div class="fl">機場</div><select id="apSel" onchange="showAirport()"></select></div>
        <div><div class="fl">航空公司</div><select id="apAirline" onchange="store('ap_airline',this.value);showAirport()">
          <option value="JX">星宇</option><option value="CI">華航</option><option value="BR">長榮</option><option value="IT">虎航</option>
        </select></div>
      </div>
      <div id="apBox"></div>
    </div>
  </section>

  <!-- ===== 座位 ===== -->
  <section class="sec" id="secSeat">
    <div class="sec-head" onclick="toggleSec('secSeat')">
      <h2>座位分配</h2><div class="chev"></div>
    </div>
    <div class="sec-body">
      <div class="fl">名單與座位（一行一組）</div>
      <textarea id="inputData" placeholder="千爸 16ABD 17CDE
領隊小優 15C
段逸萍 15AB"></textarea>
      <div id="autoInfo" class="auto-info" style="display:none;"></div>
      <button class="btn" id="processBtn" onclick="startProcessing()">分配座位</button>

      <div id="output" class="output-area">等待計算...</div>
      <div id="status" class="status" style="display:none;"></div>
      <div class="btn-row">
        <button id="undoBtn" class="btn-s" onclick="undo()" disabled>復原</button>
        <button id="copyBtn" class="btn-s" onclick="copyResult()">複製結果</button>
      </div>

      <div id="seatMapContainer" style="display:none;">
        <div class="map-bar">
          <span class="t">座位圖</span>
          <div class="zoom">
            <button onclick="seatZoom(-1)" aria-label="縮小">－</button>
            <button onclick="seatZoom(1)" aria-label="放大">＋</button>
          </div>
        </div>
        <div class="seat-map-container"><div id="seatMap"></div></div>
        <div class="map-tip">點兩個座位就互換・紅框＝這組被拆開</div>
      </div>
    </div>
  </section>
</div>

<!-- ===== 設定 ===== -->
<div class="modal" id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <h2>設定</h2>
    <div class="fl">即時資料網址（Google Apps Script）</div>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="fl">座位：領隊關鍵字（逗號分隔）</div>
    <input id="leaderKeys" value="領隊,千爸,芊爸,小優">
    <div class="fl">座位：機型</div>
    <select id="layout">
      <option value="AUTO" selected>自動判斷（直接貼名單就好）</option>
      <optgroup label="通用配置">
        <option value="3-3">通用 3-3 (ABC | DEF)</option>
        <option value="2-4-2">通用 2-4-2 (AB | CDEF | GH)</option>
        <option value="3-3-3">通用 3-3-3 (ABC | DEF | GHJ)</option>
        <option value="3-4-3">通用 3-4-3 (ABC | DEFG | HJK)</option>
      </optgroup>
      <optgroup label="中華航空">
        <option value="CI_A321">華航 A321 (ABC | HJK)</option>
        <option value="CI_A350">華航 A350 (ABC | DEG | HJK)</option>
        <option value="CI_B777">華航 B777 (ABC | DEFG | HJK)</option>
        <option value="CI_A330">華航 A330 (AB | DEFG | JK)</option>
        <option value="CI_B787">華航 B787 (新機，配置待確認)</option>
      </optgroup>
      <optgroup label="長榮航空">
        <option value="BR_B787">長榮 B787-10 (ABC | DEF | HJK)</option>
        <option value="BR_B777">長榮 B777 3-3-3版 (ABC | DEG | HJK)</option>
        <option value="BR_B777_353">長榮 B777 3-4-3版 (ABC | DEFG | HJK)</option>
        <option value="BR_A330">長榮 A330 (AC | DEFG | HK)</option>
        <option value="BR_A321">長榮 A321 (ABC | HJK)</option>
      </optgroup>
      <optgroup label="星宇航空">
        <option value="JX_A321">星宇 A321 (ABC | HJK)</option>
        <option value="JX_A330">星宇 A330neo (AC | DEFG | HK)</option>
        <option value="JX_A350">星宇 A350 (ABC | DEG | HJK)</option>
      </optgroup>
    </select>
    <button class="btn" onclick="saveSettings()">儲存</button>
  </div>
</div>

<script>
/* ===== 共用 ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function toggleSec(id){
  const el = $(id); el.classList.toggle('closed');
  store('tb_' + id, el.classList.contains('closed') ? '0' : '1');
}
function openSettings(){ $('settings').classList.add('show'); }
function closeSettings(){ $('settings').classList.remove('show'); }
function saveSettings(){
  store('fh_api', $('apiUrl').value.trim());
  try{ saveInputs(); }catch(e){}
  closeSettings();
}

let seatSize = 52;
function seatZoom(d){
  seatSize = Math.max(32, Math.min(80, seatSize + d * 8));
  $('seatMap').style.setProperty('--s', seatSize + 'px');
  store('tb_seatSize', String(seatSize));
}
</script>

<script>

const LAYOUT_CONFIGS = {
  "CI_A321": [['A','B','C'], ['H','J','K']],
  "CI_A350": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "CI_B777": [['A','B','C'], ['D','E','F','G'], ['H','J','K']],
  "CI_A330": [['A','B'], ['D','E','F','G'], ['J','K']],
  "CI_B787": [['A','B','C'], ['H','J','K']],
  "BR_B787": [['A','B','C'], ['D','E','F'], ['H','J','K']],
  "BR_B777": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "BR_B777_353": [['A','B','C'], ['D','E','F','G'], ['H','J','K']],
  "BR_A330": [['A','C'], ['D','E','F','G'], ['H','K']],
  "BR_A321": [['A','B','C'], ['H','J','K']],
  "JX_A321": [['A','B','C'], ['H','J','K']],
  "JX_A330": [['A','C'], ['D','E','F','G'], ['H','K']],
  "JX_A350": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "3-3": [['A','B','C'], ['D','E','F']],
  "2-4-2": [['A','B'], ['C','D','E','F'], ['G','H']],
  "3-3-3": [['A','B','C'], ['D','E','F'], ['G','H','J']],
  "3-4-3": [['A','B','C'], ['D','E','F','G'], ['H','J','K']]
};

const GROUP_COLORS = [
  '#e6194B','#3cb44b','#4363d8','#f58231','#911eb4',
  '#42d4f4','#f032e6','#bfef45','#fabed4','#469990',
  '#dcbeff','#9A6324','#fffac8','#800000','#aaffc3',
  '#808000','#ffd8b1','#000075','#a9a9a9','#000000'
];

const STORAGE_KEY = 'seatAssign_v3';
const SEARCH_TIME_MS = 800;      // 最多運算時間（毫秒），避免畫面卡住
const ADJ_THRESHOLD = 70;         // 分數 >= 70 視為「坐在一起」

let blocksConfig = [];
let seatPool = [];        // ['15A','15B',...]
let groups = [];          // {id,name,short,count,isLeader,color}
let seatToGroup = {};     // '15A' -> groupId
let model = null;
let seatHist = [];
let selectedSeat = null;
let draggedSeatId = null;

/* ========== 儲存 / 載入上次輸入 ========== */
function saveInputs(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      layout: document.getElementById('layout').value,
      input: document.getElementById('inputData').value,
      leaders: document.getElementById('leaderKeys').value
    }));
  }catch(e){}
}
function loadInputs(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(!d) return;
    if(d.layout && LAYOUT_CONFIGS[d.layout]) document.getElementById('layout').value = d.layout;
    if(d.input) document.getElementById('inputData').value = d.input;
    if(d.leaders) document.getElementById('leaderKeys').value = d.leaders;
  }catch(e){}
}

/* ========== 工具 ========== */
function toHalfWidth(s){
  return s.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
          .replace(/\u3000/g, ' ');
}
function textColorFor(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#111111' : '#ffffff';
}
function locate(col){
  for(let i=0;i<blocksConfig.length;i++){
    const idx = blocksConfig[i].indexOf(col);
    if(idx !== -1) return {b:i, idx:idx};
  }
  return {b:-1, idx:-1};
}
function showError(msg){
  document.getElementById('output').innerText = msg;
  document.getElementById('status').style.display = 'none';
  document.getElementById('seatMapContainer').style.display = 'none';
}

/* ========== 自動判斷機型 ==========
   找出「包含名單所有座位字母」且字母最少（最貼合）的機型；
   同分時依下面順序優先（航空公司實際機型優先於通用配置） */
const AUTO_PRIORITY = [
  'JX_A350','JX_A330','JX_A321',
  'CI_A350','CI_B777','CI_A330','CI_A321',
  'BR_B787','BR_B777','BR_B777_353','BR_A330','BR_A321',
  '3-3','2-4-2','3-3-3','3-4-3'
];
function seatLetters(raw){
  const letters = new Set();
  for(const m of toHalfWidth(raw).matchAll(/\d{1,3}([A-Za-z]+)/g))
    for(const ch of m[1].toUpperCase()) letters.add(ch);
  return letters;
}
function detectLayout(raw){
  const letters = seatLetters(raw);
  if(!letters.size) return null;
  // 先找航空公司實際機型，都不符合才用通用配置
  const tiers = [AUTO_PRIORITY.filter(k => /_/.test(k)), AUTO_PRIORITY.filter(k => !/_/.test(k))];
  for(const tier of tiers){
    let best = null, bestSize = Infinity;
    for(const key of tier){
      const all = new Set(LAYOUT_CONFIGS[key].flat());
      if(![...letters].every(ch => all.has(ch))) continue;
      if(all.size < bestSize){ bestSize = all.size; best = key; }
    }
    if(best) return best;
  }
  return null;
}
function layoutName(key){
  for(const opt of document.getElementById('layout').options)
    if(opt.value === key) return opt.text;
  return key;
}

/* ========== 依名單座位字母，自動找出可能的機型 ========== */
function suggestLayouts(raw){
  const letters = new Set();
  const re = /\d{1,3}([A-Za-z]+)/g;
  for(const m of toHalfWidth(raw).matchAll(re)) for(const ch of m[1].toUpperCase()) letters.add(ch);
  const sel = document.getElementById('layout');
  const names = [];
  for(const opt of sel.options){
    const cfg = LAYOUT_CONFIGS[opt.value];
    if(!cfg) continue;
    const all = new Set(cfg.flat());
    if([...letters].every(ch => all.has(ch))) names.push(opt.text);
  }
  return names.length
    ? `名單的座位字母符合這些機型：\n・${names.join('\n・')}`
    : '沒有任何機型符合，請檢查座位字母是否打錯。';
}

/* ========== 解析輸入 ========== */
function parseInput(raw, leaderKeys){
  const layoutLetters = new Set(blocksConfig.flat());
  const lines = toHalfWidth(raw).split(/\r?\n/);
  const re = /(\d{1,3})([A-Za-z]+)/g;
  const result = {groups:[], pool:[], dupSeats:[], badSeats:[]};
  const nameCount = {};

  lines.forEach(line => {
    if(!line.trim()) return;
    const matches = [...line.matchAll(re)];
    if(!matches.length) return;

    const seats = [];
    matches.forEach(m => {
      const row = parseInt(m[1],10);
      for(const ch of m[2].toUpperCase()) seats.push(row + ch);
    });

    let name = line;
    matches.forEach(m => { name = name.replace(m[0], ' '); });
    name = name.replace(/\s+/g,' ').trim();
    if(!name) name = `第${result.groups.length+1}組`;

    nameCount[name] = (nameCount[name] || 0) + 1;
    const display = nameCount[name] > 1 ? `${name}(${nameCount[name]})` : name;

    seats.forEach(s => {
      if(!layoutLetters.has(s.replace(/^\d+/,''))) result.badSeats.push(s);
      if(result.pool.includes(s)) result.dupSeats.push(s);
      else result.pool.push(s);
    });

    const id = result.groups.length;
    const color = GROUP_COLORS[id % GROUP_COLORS.length];
    result.groups.push({
      id, name: display,
      short: name.length > 2 ? name.slice(-2) : name,
      count: seats.length,
      isLeader: leaderKeys.some(k => k && name.includes(k)),
      color, textColor: textColorFor(color)
    });
  });
  return result;
}

/* ========== 建立分數模型（預先算好，加快運算） ========== */
function pairScore(p1, p2){
  if(p1.r === p2.r){
    if(p1.b === p2.b && Math.abs(p1.idx - p2.idx) === 1) return 100;     // 同排緊鄰
    if(Math.abs(p1.b - p2.b) === 1){                                      // 隔走道
      const L = p1.b < p2.b ? p1 : p2, R = p1.b < p2.b ? p2 : p1;
      if(L.idx === blocksConfig[L.b].length - 1 && R.idx === 0) return 80;
    }
    return 20;
  }
  if(Math.abs(p1.r - p2.r) === 1){
    if(p1.c === p2.c) return 70;                                          // 前後排同位置
    if(p1.b === p2.b && Math.abs(p1.idx - p2.idx) === 1) return 40;       // 斜對角
    return 10;
  }
  return 0;
}
function buildModel(pool){
  const n = pool.length;
  const info = pool.map(s => {
    const r = parseInt(s,10), c = s.replace(/^\d+/,'');
    const loc = locate(c);
    return {id:s, r, c, b:loc.b, idx:loc.idx};
  });
  const aisle = info.map(p =>
    (p.b < blocksConfig.length - 1 && p.idx === blocksConfig[p.b].length - 1) || (p.b > 0 && p.idx === 0));
  const M = [];
  for(let i=0;i<n;i++) M.push(new Int32Array(n));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    M[i][j] = M[j][i] = pairScore(info[i], info[j]);
  }
  const indexOf = {};
  pool.forEach((s,i) => indexOf[s] = i);
  return {n, info, aisle, M, indexOf};
}

function groupScore(idxs, isLeader){
  let coh = 0, rowSum = 0, minRow = Infinity, hasAisle = false;
  for(let a=0;a<idxs.length;a++){
    const i = idxs[a];
    const r = model.info[i].r;
    rowSum += r;
    if(r < minRow) minRow = r;
    if(model.aisle[i]) hasAisle = true;
    for(let b=a+1;b<idxs.length;b++) coh += model.M[i][idxs[b]];
  }
  // 優先順序：領隊坐走道 > 每組都沒被拆開 > 領隊靠前排 > 坐得越緊越好 > 整體靠前
  let s = coh * 1000 - rowSum;
  if(isConnected(idxs)) s += 3000000;
  if(isLeader){
    if(hasAisle) s += 50000000;
    s -= minRow * 20000;
  }
  return s;
}

/* 這組是否全部相連（同排緊鄰／隔走道／前後排同位置都算） */
function isConnected(idxs){
  if(idxs.length < 2) return true;
  const seen = [idxs[0]];
  for(let k=0;k<seen.length;k++){
    const cur = seen[k];
    for(const nx of idxs){
      if(seen.indexOf(nx) === -1 && model.M[cur][nx] >= ADJ_THRESHOLD) seen.push(nx);
    }
  }
  return seen.length === idxs.length;
}

/* ========== 貪婪建立一組 ========== */
function buildBestCluster(avail, count, isLeader){
  let best = null, bestScore = -Infinity;
  for(const seed of avail){
    const cluster = [seed];
    const used = new Set([seed]);
    while(cluster.length < count){
      let bn = -1, bs = -Infinity;
      for(const c of avail){
        if(used.has(c)) continue;
        let add = 0;
        for(const s of cluster) add += model.M[s][c];
        if(add > bs){ bs = add; bn = c; }
      }
      if(bn < 0) break;
      cluster.push(bn); used.add(bn);
    }
    if(cluster.length < count) continue;
    const sc = groupScore(cluster, isLeader);
    if(sc > bestScore){ bestScore = sc; best = cluster; }
  }
  return best;
}

/* ========== 局部互換優化：兩組之間換位，總分變高就換 ========== */
function localImprove(assign){
  const owner = new Int32Array(model.n);
  const scores = [];
  groups.forEach(g => {
    assign[g.id].forEach(s => owner[s] = g.id);
    scores[g.id] = groupScore(assign[g.id], g.isLeader);
  });

  let improved = true, passes = 0;
  while(improved && passes < 30){
    improved = false; passes++;
    for(let i=0;i<model.n;i++){
      for(let j=i+1;j<model.n;j++){
        const gi = owner[i], gj = owner[j];
        if(gi === gj) continue;
        const A = assign[gi], B = assign[gj];
        const ai = A.indexOf(i), bj = B.indexOf(j);
        A[ai] = j; B[bj] = i;
        const nA = groupScore(A, groups[gi].isLeader);
        const nB = groupScore(B, groups[gj].isLeader);
        if(nA + nB > scores[gi] + scores[gj]){
          scores[gi] = nA; scores[gj] = nB;
          owner[i] = gj; owner[j] = gi;
          improved = true;
        }else{
          A[ai] = i; B[bj] = j;
        }
      }
    }
  }
  return scores.reduce((a,b) => a + b, 0);
}

/* ========== 主求解：多次隨機重啟 + 局部優化，有時間上限 ========== */
function solve(){
  const baseOrder = [...groups].sort((a,b) => (b.count - a.count) || (b.isLeader - a.isLeader));
  let bestAssign = null, bestScore = -Infinity;
  const t0 = performance.now();
  let iter = 0;

  while(iter === 0 || (performance.now() - t0 < SEARCH_TIME_MS && iter < 2000)){
    const order = [...baseOrder];
    if(iter > 0){
      for(let i=order.length-1;i>0;i--){
        if(Math.random() < 0.4){
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
      }
    }
    let avail = [...Array(model.n).keys()];
    const assign = [];
    let ok = true;
    for(const g of order){
      const cl = buildBestCluster(avail, g.count, g.isLeader);
      if(!cl){ ok = false; break; }
      assign[g.id] = cl;
      const set = new Set(cl);
      avail = avail.filter(x => !set.has(x));
    }
    if(ok){
      const total = localImprove(assign);
      if(total > bestScore){
        bestScore = total;
        bestAssign = assign.map(a => a.slice());
      }
    }
    iter++;
  }
  return bestAssign;
}

/* ========== 按鈕流程 ========== */
function startProcessing(){
  const btn = document.getElementById('processBtn');
  btn.innerText = "計算中…";
  btn.disabled = true;
  setTimeout(() => {
    try{ processSeats(); }
    finally{
      btn.innerText = "分配座位";
      btn.disabled = false;
    }
  }, 50);
}

function processSeats(){
  const raw = document.getElementById('inputData').value.trim();
  let layoutType = document.getElementById('layout').value;
  saveInputs();
  const autoInfo = document.getElementById('autoInfo');
  autoInfo.style.display = 'none';

  if(!raw){ showError("請輸入名單與座位！"); return; }

  if(layoutType === 'AUTO'){
    const found = detectLayout(raw);
    if(!found){
      showError("認不出機型，請檢查座位字母是否打錯，或手動選擇機型。");
      return;
    }
    layoutType = found;
    autoInfo.innerText = `機型：${layoutName(found)}`;
    autoInfo.style.display = 'block';
  }
  blocksConfig = LAYOUT_CONFIGS[layoutType];

  const leaderKeys = document.getElementById('leaderKeys').value
    .split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
  const parsed = parseInput(raw, leaderKeys);

  if(parsed.pool.length === 0){ showError("找不到有效座位，請確認輸入格式（例如：王小明 16AB）"); return; }
  if(parsed.badSeats.length){
    showError(`這些座位不在所選機型裡：${[...new Set(parsed.badSeats)].join('、')}\n` + suggestLayouts(raw));
    return;
  }
  if(parsed.dupSeats.length){
    showError(`這些座位重複輸入了：${[...new Set(parsed.dupSeats)].join('、')}\n請修正後再分配。`);
    return;
  }

  groups = parsed.groups;
  seatPool = parsed.pool;
  model = buildModel(seatPool);

  const best = solve();
  if(!best){ showError("座位數量異常，請檢查。"); return; }

  seatToGroup = {};
  best.forEach((idxs, gid) => idxs.forEach(i => seatToGroup[seatPool[i]] = gid));

  seatHist = [];
  selectedSeat = null;
  document.getElementById('undoBtn').disabled = true;
  document.getElementById('seatMapContainer').style.display = 'block';
  refreshAll();
}

/* ========== 檢查被拆開的組 ========== */
function findSplitGroups(){
  const byGroup = {};
  for(const s in seatToGroup){
    (byGroup[seatToGroup[s]] = byGroup[seatToGroup[s]] || []).push(model.indexOf[s]);
  }
  const split = new Set();
  for(const gid in byGroup){
    const idxs = byGroup[gid];
    if(idxs.length < 2) continue;
    const seen = new Set([idxs[0]]), stack = [idxs[0]];
    while(stack.length){
      const cur = stack.pop();
      for(const nx of idxs){
        if(!seen.has(nx) && model.M[cur][nx] >= ADJ_THRESHOLD){ seen.add(nx); stack.push(nx); }
      }
    }
    if(seen.size < idxs.length) split.add(Number(gid));
  }
  return split;
}

function refreshAll(){
  const split = findSplitGroups();
  renderVisualMap(split);
  updateTextOutput();
  updateStatus(split);
}

function updateStatus(split){
  const el = document.getElementById('status');
  const msgs = [];
  if(split.size){
    msgs.push(`被拆開：${[...split].map(id => groups[id].name).join('、')}`);
  }
  groups.filter(g => g.isLeader).forEach(g => {
    const onAisle = Object.keys(seatToGroup).some(s => seatToGroup[s] === g.id && model.aisle[model.indexOf[s]]);
    if(!onAisle) msgs.push(`${g.name} 不在走道位`);
  });
  el.style.display = 'block';
  if(msgs.length){
    el.className = 'status warn';
    el.innerText = msgs.join('\n') + '';
  }else{
    el.className = 'status ok';
    el.innerText = '每組都坐在一起・領隊在走道';
  }
}

/* ========== 畫座位圖 ========== */
function renderVisualMap(split){
  const seatMapDiv = document.getElementById('seatMap');
  seatMapDiv.innerHTML = '';
  const poolSet = new Set(seatPool);
  const rows = [...new Set(seatPool.map(s => parseInt(s,10)))].sort((a,b) => a - b);
  if(!rows.length) return;

  for(let r = rows[0]; r <= rows[rows.length-1]; r++){
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';

    blocksConfig.forEach((block, bIdx) => {
      const blockDiv = document.createElement('div');
      blockDiv.className = 'seat-block';

      block.forEach(letter => {
        const seatId = r + letter;
        const seatDiv = document.createElement('div');
        seatDiv.className = 'seat';
        seatDiv.dataset.seat = seatId;

        if(poolSet.has(seatId)){
          seatDiv.classList.add('valid-seat');
          const gid = seatToGroup[seatId];
          if(gid !== undefined){
            const g = groups[gid];
            seatDiv.innerText = g.short;
            seatDiv.classList.add('assigned');
            seatDiv.style.backgroundColor = g.color;
            seatDiv.style.color = g.textColor;
            seatDiv.title = `${seatId} - ${g.name}`;
            if(split.has(gid)) seatDiv.classList.add('split');
          }else{
            seatDiv.innerText = "+";
            seatDiv.title = `${seatId} - 空位`;
          }
          if(selectedSeat === seatId) seatDiv.classList.add('selected');

          seatDiv.addEventListener('click', handleTap);
          seatDiv.draggable = true;
          seatDiv.addEventListener('dragstart', handleDragStart);
          seatDiv.addEventListener('dragover', handleDragOver);
          seatDiv.addEventListener('drop', handleDrop);
          seatDiv.addEventListener('dragenter', function(){ this.classList.add('over'); });
          seatDiv.addEventListener('dragleave', function(){ this.classList.remove('over'); });
          seatDiv.addEventListener('dragend', handleDragEnd);
        }else{
          seatDiv.classList.add('invalid-seat');
          seatDiv.innerText = letter;
          seatDiv.title = "非名單內座位";
        }
        blockDiv.appendChild(seatDiv);
      });
      rowDiv.appendChild(blockDiv);

      if(bIdx < blocksConfig.length - 1){
        const aisleDiv = document.createElement('div');
        aisleDiv.className = 'aisle';
        aisleDiv.innerText = r;
        rowDiv.appendChild(aisleDiv);
      }
    });
    seatMapDiv.appendChild(rowDiv);
  }
}

/* ========== 文字結果 ========== */
function updateTextOutput(){
  const lists = groups.map(() => []);
  for(const s in seatToGroup) lists[seatToGroup[s]].push(s);

  const out = [];
  groups.forEach(g => {
    const rowMap = {};
    lists[g.id].forEach(s => {
      const row = parseInt(s,10);
      (rowMap[row] = rowMap[row] || []).push(s.replace(/^\d+/,''));
    });
    const parts = Object.keys(rowMap).sort((a,b) => a - b)
      .map(row => row + rowMap[row].sort().join(''));
    if(parts.length) out.push(`${g.name} ${parts.join(' ')}`);
  });
  document.getElementById('output').innerText = out.join('\n');
}

/* ========== 互換 / 復原 ========== */
function swapSeats(a, b){
  if(a === b) return;
  seatHist.push(JSON.stringify(seatToGroup));
  if(seatHist.length > 50) seatHist.shift();
  document.getElementById('undoBtn').disabled = false;

  const ga = seatToGroup[a], gb = seatToGroup[b];
  if(gb === undefined) delete seatToGroup[a]; else seatToGroup[a] = gb;
  if(ga === undefined) delete seatToGroup[b]; else seatToGroup[b] = ga;
  refreshAll();
}
function undo(){
  if(!seatHist.length) return;
  seatToGroup = JSON.parse(seatHist.pop());
  selectedSeat = null;
  document.getElementById('undoBtn').disabled = seatHist.length === 0;
  refreshAll();
}

/* 點選互換（手機好用） */
function handleTap(){
  const id = this.dataset.seat;
  if(selectedSeat === null){
    selectedSeat = id;
    refreshAll();
  }else if(selectedSeat === id){
    selectedSeat = null;
    refreshAll();
  }else{
    const from = selectedSeat;
    selectedSeat = null;
    swapSeats(from, id);
  }
}

/* 拖曳互換（電腦） */
function handleDragStart(e){
  draggedSeatId = this.dataset.seat;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedSeatId);
}
function handleDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDrop(e){
  e.preventDefault(); e.stopPropagation();
  this.classList.remove('over');
  const target = this.dataset.seat;
  if(draggedSeatId && draggedSeatId !== target){
    selectedSeat = null;
    swapSeats(draggedSeatId, target);
  }
  draggedSeatId = null;
}
function handleDragEnd(){
  this.classList.remove('dragging');
  document.querySelectorAll('.seat.over').forEach(s => s.classList.remove('over'));
}

/* ========== 複製 ========== */
function copyResult(){
  const text = document.getElementById('output').innerText;
  if(!text || text === "等待計算..." || text.startsWith("這些座位") || text.startsWith("認不出") || text.startsWith("請輸入") || text.startsWith("找不到")){
    alert("目前沒有可以複製的結果唷！");
    return;
  }
  const done = () => {
    const btn = document.getElementById('copyBtn');
    btn.innerText = "已複製";
    setTimeout(() => { btn.innerText = "複製結果"; }, 2000);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy') ? done() : alert("複製失敗，請手動框選文字複製。"); }
    catch(e){ alert("複製失敗，請手動框選文字複製。"); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{
    fallback();
  }
}

loadInputs();

</script>

      T2:{area:'第 2 航廈 3F（華航、星宇、虎航）', order:'A → S',
        scale:[], scaleNote:'官方地圖沒有標示電子秤',
        toilet:['A、B 中間的後方','D 櫃台後方','O、P 中間的後方','R、S 中間的後方'],
        elev:['A 櫃台前方','C 櫃台前方','D、E 中間後方','I、J 中間前方','K 櫃台前方','O 櫃台後方','S 櫃台前方']}
    },
    links:[['官方地圖','https://www.narita-airport.jp/ja/map/'],['出發航班','https://www.narita-airport.jp/ja/flight/dep-search/']]},
  NGO:{name:'中部', area:'第 1 航廈 3F 國際線', term:{'*':'第 1 航廈 3F'},
    order:'A/B　C/D　E/F　G/H　I/J',
    scale:['E/F 和 G/H 中間的前方（入口那面牆，電梯旁）'], scaleNote:'',
    toilet:['A/B 後方（保安檢查場左邊）','E/F 和 G/H 中間的後方','I/J 後方'],
    elev:['E/F 和 G/H 中間前方（電子秤旁）','C/D 和 E/F 中間後方（Anker Store 旁）'],
    links:[['官方地圖','https://www.centrair.jp/map/']]},
  UKB:{name:'神戶', area:'第 2 航廈 1F', term:{'*':'第 2 航廈'},
    order:'報到櫃台在資訊中心旁',
    scale:[], scaleNote:'官方地圖沒有標示電子秤',
    toilet:['報到櫃台旁（資訊中心那一側）','Lounge KOBE 旁'],
    elev:['報到大廳，大和運輸行李櫃台旁'],
    links:[['官方地圖','https://www.kairport.co.jp/map']]},
  AKJ:{name:'旭川', area:'1F 國際線', term:{'*':'1F 國際線'},
    order:'國際線報到櫃台一整排（1F 國際線那一側）',
    scale:[], scaleNote:'官方地圖沒有標示電子秤',
    toilet:['報到櫃台最旁邊（國際線那一端），兩處'],
    elev:['廁所後面（國際線行李提領處旁）'],
    links:[['官方地圖','https://www.hokkaido-airports.com/ja/asahikawa/floormap/']]}
};

function todayTW(){
  const d = new Date(Date.now() + (8*60 + new Date().getTimezoneOffset())*60000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const md = s => { const p = s.split(/[-/]/); return parseInt(p[1],10)+'/'+parseInt(p[2],10); };
const apiUrl = () => (load('fh_api') || DEFAULT_API || '').trim();

(function initFlight(){
  $('flightDate').value = todayTW();
  $('apiUrl').value = load('fh_api') || DEFAULT_API;
  const last = load('fh_last'); if(last) $('flightNo').value = last;
  $('flightNo').addEventListener('keydown', e => { if(e.key === 'Enter') searchFlight(); });
  ['secFlight','secSeat'].forEach(id => { if(load('tb_' + id) === '0') $(id).classList.add('closed'); });
  const sz = parseInt(load('tb_seatSize') || '', 10); if(sz){ seatSize = sz; $('seatMap').style.setProperty('--s', sz + 'px'); }
})();

async function searchFlight(){
  const flight = $('flightNo').value.toUpperCase().replace(/\s+/g,'');
  const date = $('flightDate').value.replace(/-/g,'/');
  const m = flight.match(/^([A-Z0-9]{2})(\d{1,4})$/);
  const box = $('flightResult');
  if(!m){ box.innerHTML = `<div class="msg bad">請輸入航班號，例如 JX850</div>`; return; }
  store('fh_last', flight);
  const api = apiUrl();
  if(!api){ box.innerHTML = `<div class="msg blue">請先按右上角「設定」貼上即時資料網址</div>`; return; }

  const btn = $('searchBtn'); btn.disabled = true; btn.innerText = '查詢中…';
  let data;
  try{
    const r = await fetch(api + (api.includes('?') ? '&' : '?') + 'flight=' + encodeURIComponent(flight) + '&date=' + encodeURIComponent(date), {cache:'no-store'});
    data = await r.json();
  }catch(e){ data = {ok:false, error:'連不到即時資料，請檢查網路或網址'}; }
  btn.disabled = false; btn.innerText = '查詢';

  if(!data.ok){ box.innerHTML = `<div class="msg bad">${esc(data.error || '查詢失敗')}</div>`; return; }
  const rows = (data.rows || []).filter(r => r.schedDate === date);
  const al = AIRLINES[m[1]] || {name:m[1], close:'以航空公司官網為準'};
  let h = '';

  if(!rows.length){
    h += `<div class="msg warn">${md(date)} 查不到 ${esc(flight)}，請確認航班號和日期</div>`;
  }else if(data.mode === 'timetable'){
    h += `<div class="msg blue">依桃園機場時刻表・登機門當天公布</div>`;
  }else if(data.mode === 'estimate'){
    h += `<div class="msg warn">時刻表還沒公布，依最近一班推估，出發前一天再查一次</div>`;
  }
  rows.forEach(r => h += flightBlock(r, al));

  const r0 = rows[0];
  if(r0){
    if(JP[r0.place]) h += jpBlock(r0.place, m[1]);
    h += `<div class="note">更新：${esc(data.fetchedAt || '')}・${data.mode === 'live' ? '桃園機場即時資料' : (data.mode === 'timetable' ? '桃園機場時刻表' : '推估')}</div>`;
  }
  box.innerHTML = h;
}

function pillClass(s){ return /取消/.test(s) ? 'bad' : (/延|更改|變更|預估/.test(s) ? 'warn' : (/時刻表/.test(s) ? 'info' : 'ok')); }

function flightBlock(r, al){
  const dep = r.type === 'D';
  const term = r.terminal === '1' ? 'T1' : (r.terminal === '2' ? 'T2' : '—');
  const late = r.estTime && r.estTime !== r.schedTime;
  const ref = r.source && r.source !== 'live';
  const tiles = dep
    ? [[ref ? '報到櫃台（參考）' : '報到櫃台', r.counter ? r.counter + ' 號' : '—', true], ['登機門', r.gate || (ref ? '當天公布' : '未公布')], ['航廈', term], ['機型', r.aircraft || '—', false, true]]
    : [[ref ? '行李轉盤（參考）' : '行李轉盤', r.carousel ? parseInt(r.carousel,10) + ' 號' : '—', true], ['抵達門', r.gate || '—'], ['航廈', term], ['機型', r.aircraft || '—', false, true]];
  return `<div class="fcard">
    <div class="f-top"><span class="f-title">${dep ? '出發' : '抵達'}　${esc(r.flightNo)}</span><span class="pill ${pillClass(r.status)}">${esc(r.status)}</span></div>
    <div class="route">${dep ? '桃園 → ' + esc(r.placeZh) : esc(r.placeZh) + ' → 桃園'}</div>
    <div class="ftime">${esc(al.name)}・${dep ? '起飛' : '抵達'} ${esc(r.schedTime)}${late ? '　<b>預計 ' + esc(r.estTime) + '</b>' : ''}</div>
    <div class="tiles">${tiles.map(t => `<div class="tile${t[2] ? ' hl' : ''}"><div class="k">${t[0]}</div><div class="v${t[3] ? ' s' : ''}">${esc(t[1])}</div></div>`).join('')}</div>
  </div>`;
}

function rowsHtml(list){
  return `<div class="rows">${list.map(x => `<div class="r"><div class="rk">${x[0]}</div><div class="rv${x[2] ? ' good' : ''}">${esc(x[1])}</div></div>`).join('')}</div>`;
}

function lines(arr){ return arr.length ? arr.map(x => `<div>${esc(x)}</div>`).join('') : '<div class="muted">—</div>'; }

function airportHtml(code, airline){
  const a = JP[code]; if(!a) return '';
  let blocks = [];
  if(a.byTerm){
    const t = (airline === 'BR') ? ['T1'] : (['CI','JX','IT'].includes(airline) ? ['T2'] : ['T1','T2']);
    blocks = t.map(k => a.byTerm[k]);
  }else{
    blocks = [a];
  }
  const note = load('ap_note_' + code) || '';
  return `<div class="ap">
    <div class="ap-head">${esc(a.name)}機場</div>
    <div class="ap-check" data-code="${code}">${apCheckHtml(code)}</div>
    ${blocks.map(b => `
      <div class="ap-area">${esc(b.area)}</div>
      <div class="ap-order">櫃台順序：${esc(b.order)}</div>
      <div class="rows">
        <div class="r"><div class="rk">電子秤</div><div class="rv${b.scale.length ? ' good' : ''}">${b.scale.length ? lines(b.scale) : esc(b.scaleNote)}${b.scale.length && b.scaleNote ? `<div class="muted">${esc(b.scaleNote)}</div>` : ''}</div></div>
        <div class="r"><div class="rk">廁所</div><div class="rv">${lines(b.toilet)}</div></div>
        <div class="r"><div class="rk">電梯</div><div class="rv">${lines(b.elev)}</div></div>
      </div>`).join('')}
    <div class="muted" style="margin-top:8px;">前方＝入口那一側，後方＝往安檢口那一側</div>
    <div class="fl" style="margin-top:12px;">領隊筆記</div>
    <textarea class="ap-note" data-code="${code}" placeholder="例：秤在 C 櫃台對面柱子旁" oninput="store('ap_note_'+this.dataset.code,this.value)">${esc(note)}</textarea>
    <div class="links">${a.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div>
  </div>`;
}

/* 比對官方地圖有沒有變動（Code.gs 每 12 小時查一次） */
let AP_STATUS = null;
function apCheckHtml(code){
  if(!AP_STATUS) return '<div class="muted">正在比對官方地圖…</div>';
  const st = (AP_STATUS.airports || {})[code];
  const day = md(AP_STATUS.checkedAt || '');
  if(!st) return '';
  if(st.status === 'same') return `<div class="chk ok">與官方地圖一致（${esc(day)} 比對）</div>`;
  if(st.status === 'changed') return `<div class="chk bad">官方地圖有變動，位置可能不一樣了。請到現場確認，並跟 Claude 說「更新機場資料」</div>`;
  if(st.status === 'manual') return `<div class="muted">成田無法自動比對，資料日期 ${esc(AP_STATUS.baseDate || '')}</div>`;
  return `<div class="muted">暫時無法比對，資料日期 ${esc(AP_STATUS.baseDate || '')}</div>`;
}
function refreshApChecks(){
  document.querySelectorAll('.ap-check').forEach(el => el.innerHTML = apCheckHtml(el.dataset.code));
}
async function loadApStatus(){
  try{
    const c = JSON.parse(load('ap_status') || 'null');
    if(c && Date.now() - c.t < 6 * 3600 * 1000){ AP_STATUS = c.d; refreshApChecks(); return; }
  }catch(e){}
  const api = apiUrl();
  if(!api){ AP_STATUS = {airports:{}}; refreshApChecks(); return; }
  try{
    const r = await fetch(api + (api.includes('?') ? '&' : '?') + 'action=airports', {cache:'no-store'});
    const d = await r.json();
    if(d && d.ok){ AP_STATUS = d; store('ap_status', JSON.stringify({t:Date.now(), d})); }
    else AP_STATUS = {airports:{}};
  }catch(e){ AP_STATUS = {airports:{}}; }
  refreshApChecks();
}

function jpBlock(code, airline){ return `<div class="info">${airportHtml(code, airline)}</div>`; }

function showAirport(){
  const code = $('apSel').value;
  store('ap_last', code);
  $('apBox').innerHTML = code ? airportHtml(code, $('apAirline').value) : '';
}

(function initAirport(){
  const sel = $('apSel');
  sel.innerHTML = Object.keys(JP).map(k => `<option value="${k}">${JP[k].name}</option>`).join('');
  const last = load('ap_last'); if(last && JP[last]) sel.value = last;
  const al = load('ap_airline'); if(al) $('apAirline').value = al;
  if(load('tb_secAirport') === '0') $('secAirport').classList.add('closed');
  showAirport();
  loadApStatus();
})();

</script>
