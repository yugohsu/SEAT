<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 機位分配（親子不拆散優化版）</title>
<style>
:root{
  --primary:#2563eb; --bg:#f8fafc; --panel:#ffffff; --text:#1e293b;
  --border:#e2e8f0; --ok:#16a34a; --warn:#dc2626; --muted:#64748b;
}
*{box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:12px;
  display:flex; justify-content:center; font-size:18px;
}
.container{max-width:980px;width:100%;background:var(--panel);padding:20px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
h1{font-size:1.6rem;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid var(--border);}
label{display:block;font-weight:800;margin-bottom:8px;font-size:1.1rem;}
.form-group{margin-bottom:18px;}
.hint{font-size:15px;color:var(--muted);font-weight:600;margin-top:6px;}
select,textarea,input[type=text]{
  width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;
  font-size:18px;font-weight:600;color:var(--text);background:#fff;
}
textarea{resize:vertical;font-family:Consolas,"Microsoft JhengHei",monospace;line-height:1.5;}
button{border:none;border-radius:10px;font-weight:800;cursor:pointer;color:#fff;font-family:inherit;}
button:disabled{background:#94a3b8 !important;cursor:not-allowed;}
#processBtn{background:var(--primary);width:100%;padding:18px;font-size:24px;}
#processBtn:hover{background:#1d4ed8;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.copy-btn{background:#10b981;padding:12px 20px;font-size:20px;}
.undo-btn{background:#f59e0b;padding:12px 20px;font-size:20px;}
.header-flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px;}
.output-area{
  background:#f1f5f9;padding:15px;border-radius:8px;min-height:90px;white-space:pre-wrap;
  font-family:Consolas,"Microsoft JhengHei",monospace;font-size:19px;font-weight:700;border:2px solid var(--border);
}
.status{margin-top:12px;padding:12px 14px;border-radius:8px;font-weight:800;font-size:18px;line-height:1.6;}
.status.ok{background:#dcfce7;color:#166534;}
.status.warn{background:#fee2e2;color:#991b1b;}

.seat-map-container{margin-top:24px;overflow-x:auto;padding:10px 0;border-top:2px dashed var(--border);}
.map-title{font-weight:800;font-size:1.2rem;margin-bottom:10px;}
.map-tip{font-size:16px;color:var(--muted);font-weight:700;margin-bottom:14px;}
.seat-row{display:flex;align-items:center;margin-bottom:8px;min-width:max-content;}
.seat-block{display:flex;gap:6px;}
.aisle{width:40px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#94a3b8;font-size:16px;user-select:none;}
.seat{
  width:58px;height:58px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;text-align:center;user-select:none;-webkit-user-select:none;
  transition:transform .1s, box-shadow .1s; line-height:1.1;
}
.valid-seat{background:#e2e8f0;border:2px solid #94a3b8;color:#475569;cursor:pointer;}
.invalid-seat{background:transparent;border:1px dashed #cbd5e1;color:#cbd5e1;font-size:12px;opacity:.6;}
.assigned{border:none;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.seat.selected{outline:4px solid #111;outline-offset:2px;transform:scale(1.08);}
.seat.dragging{opacity:.5;transform:scale(.95);}
.seat.over{outline:3px dashed var(--primary);transform:scale(1.05);}
.seat.split{box-shadow:0 0 0 3px #dc2626 inset;}
</style>
</head>
<body>

<div class="container">
  <h1>✈️ 機位分配（親子不拆散優化版）</h1>

  <div class="form-group">
    <label for="layout">選擇航空公司與機型</label>
    <select id="layout">
      <optgroup label="通用配置">
        <option value="3-3">通用 3-3 (ABC | DEF)</option>
        <option value="2-4-2">通用 2-4-2 (AB | CDEF | GH)</option>
        <option value="3-3-3">通用 3-3-3 (ABC | DEF | GHJ)</option>
        <option value="3-4-3">通用 3-4-3 (ABC | DEFG | HJK)</option>
      </optgroup>
      <optgroup label="🌸 中華航空">
        <option value="CI_A321">華航 A321 (ABC | HJK)</option>
        <option value="CI_A350">華航 A350 (ABC | DEG | HJK)</option>
        <option value="CI_B777">華航 B777 (ABC | DEFG | HJK)</option>
        <option value="CI_A330">華航 A330 (AB | DEFG | JK)</option>
        <option value="CI_B787">華航 B787 (新機，配置待確認)</option>
      </optgroup>
      <optgroup label="🟢 長榮航空">
        <option value="BR_B787">長榮 B787-10 (ABC | DEF | HJK)</option>
        <option value="BR_B777">長榮 B777 3-3-3版 (ABC | DEG | HJK)</option>
        <option value="BR_B777_353">長榮 B777 3-4-3版 (ABC | DEFG | HJK)</option>
        <option value="BR_A330">長榮 A330 (AC | DEFG | HK)</option>
        <option value="BR_A321">長榮 A321 (ABC | HJK)</option>
      </optgroup>
      <optgroup label="⭐ 星宇航空">
        <option value="JX_A321">星宇 A321 (ABC | HJK)</option>
        <option value="JX_A330">星宇 A330neo (AC | DEFG | HK)</option>
        <option value="JX_A350">星宇 A350 (ABC | DEG | HJK)</option>
      </optgroup>
    </select>
  </div>

  <div class="form-group">
    <label for="inputData">輸入名單與座位（一行一組）</label>
    <textarea id="inputData" rows="7" placeholder="範例：
千爸 16ABD 17CDE
領隊小優 15C
段逸萍 15AB"></textarea>
    <div class="hint">全形字、小寫字母都可以，會自動轉換</div>
  </div>

  <div class="form-group">
    <label for="leaderKeys">領隊關鍵字（優先走道、前排）</label>
    <input type="text" id="leaderKeys" value="領隊,千爸,芊爸,小優">
    <div class="hint">用逗號分隔，名字含這些字就當作領隊</div>
  </div>

  <button id="processBtn" onclick="startProcessing()">立即分配座位</button>

  <div class="header-flex">
    <label style="margin:0;">📝 分配結果</label>
    <div class="btn-row">
      <button id="undoBtn" class="undo-btn" onclick="undo()" disabled>↩️ 復原</button>
      <button id="copyBtn" class="copy-btn" onclick="copyResult()">📋 一鍵複製</button>
    </div>
  </div>
  <div id="output" class="output-area">等待計算...</div>
  <div id="status" class="status" style="display:none;"></div>

  <div id="seatMapContainer" class="seat-map-container" style="display:none;">
    <div class="map-title">💺 視覺化座位圖</div>
    <div class="map-tip">手機：點一個座位，再點另一個就互換｜電腦：也可直接拖曳<br>紅框 = 這組被拆開了</div>
    <div id="seatMap"></div>
  </div>
</div>

<script>
const LAYOUT_CONFIGS = {
  "CI_A321": [['A','B','C'], ['H','J','K']],
  "CI_A350": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "CI_B777": [['A','B','C'], ['D','E','F','G'], ['H','J','K']],
  "CI_A330": [['A','B'], ['D','E','F','G'], ['J','K']],
  "CI_B787": [['A','B','C'], ['H','J','K']],
  "BR_B787": [['A','B','C'], ['D','E','F'], ['H','J','K']],
  "BR_B777": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "BR_B777_353": [['A','B','C'], ['D','E','F','G'], ['H','J','K']],
  "BR_A330": [['A','C'], ['D','E','F','G'], ['H','K']],
  "BR_A321": [['A','B','C'], ['H','J','K']],
  "JX_A321": [['A','B','C'], ['H','J','K']],
  "JX_A330": [['A','C'], ['D','E','F','G'], ['H','K']],
  "JX_A350": [['A','B','C'], ['D','E','G'], ['H','J','K']],
  "3-3": [['A','B','C'], ['D','E','F']],
  "2-4-2": [['A','B'], ['C','D','E','F'], ['G','H']],
  "3-3-3": [['A','B','C'], ['D','E','F'], ['G','H','J']],
  "3-4-3": [['A','B','C'], ['D','E','F','G'], ['H','J','K']]
};

const GROUP_COLORS = [
  '#e6194B','#3cb44b','#4363d8','#f58231','#911eb4',
  '#42d4f4','#f032e6','#bfef45','#fabed4','#469990',
  '#dcbeff','#9A6324','#fffac8','#800000','#aaffc3',
  '#808000','#ffd8b1','#000075','#a9a9a9','#000000'
];

const STORAGE_KEY = 'seatAssign_v2';
const SEARCH_TIME_MS = 800;      // 最多運算時間（毫秒），避免畫面卡住
const ADJ_THRESHOLD = 70;         // 分數 >= 70 視為「坐在一起」

let blocksConfig = [];
let seatPool = [];        // ['15A','15B',...]
let groups = [];          // {id,name,short,count,isLeader,color}
let seatToGroup = {};     // '15A' -> groupId
let model = null;
let history = [];
let selectedSeat = null;
let draggedSeatId = null;

/* ========== 儲存 / 載入上次輸入 ========== */
function saveInputs(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      layout: document.getElementById('layout').value,
      input: document.getElementById('inputData').value,
      leaders: document.getElementById('leaderKeys').value
    }));
  }catch(e){}
}
function loadInputs(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(!d) return;
    if(d.layout && LAYOUT_CONFIGS[d.layout]) document.getElementById('layout').value = d.layout;
    if(d.input) document.getElementById('inputData').value = d.input;
    if(d.leaders) document.getElementById('leaderKeys').value = d.leaders;
  }catch(e){}
}

/* ========== 工具 ========== */
function toHalfWidth(s){
  return s.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
          .replace(/\u3000/g, ' ');
}
function textColorFor(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#111111' : '#ffffff';
}
function locate(col){
  for(let i=0;i<blocksConfig.length;i++){
    const idx = blocksConfig[i].indexOf(col);
    if(idx !== -1) return {b:i, idx:idx};
  }
  return {b:-1, idx:-1};
}
function showError(msg){
  document.getElementById('output').innerText = msg;
  document.getElementById('status').style.display = 'none';
  document.getElementById('seatMapContainer').style.display = 'none';
}

/* ========== 依名單座位字母，自動找出可能的機型 ========== */
function suggestLayouts(raw){
  const letters = new Set();
  const re = /\d{1,3}([A-Za-z]+)/g;
  for(const m of toHalfWidth(raw).matchAll(re)) for(const ch of m[1].toUpperCase()) letters.add(ch);
  const sel = document.getElementById('layout');
  const names = [];
  for(const opt of sel.options){
    const cfg = LAYOUT_CONFIGS[opt.value];
    if(!cfg) continue;
    const all = new Set(cfg.flat());
    if([...letters].every(ch => all.has(ch))) names.push(opt.text);
  }
  return names.length
    ? `👉 名單的座位字母符合這些機型：\n・${names.join('\n・')}`
    : '👉 沒有任何機型符合，請檢查座位字母是否打錯。';
}

/* ========== 解析輸入 ========== */
function parseInput(raw, leaderKeys){
  const layoutLetters = new Set(blocksConfig.flat());
  const lines = toHalfWidth(raw).split(/\r?\n/);
  const re = /(\d{1,3})([A-Za-z]+)/g;
  const result = {groups:[], pool:[], dupSeats:[], badSeats:[]};
  const nameCount = {};

  lines.forEach(line => {
    if(!line.trim()) return;
    const matches = [...line.matchAll(re)];
    if(!matches.length) return;

    const seats = [];
    matches.forEach(m => {
      const row = parseInt(m[1],10);
      for(const ch of m[2].toUpperCase()) seats.push(row + ch);
    });

    let name = line;
    matches.forEach(m => { name = name.replace(m[0], ' '); });
    name = name.replace(/\s+/g,' ').trim();
    if(!name) name = `第${result.groups.length+1}組`;

    nameCount[name] = (nameCount[name] || 0) + 1;
    const display = nameCount[name] > 1 ? `${name}(${nameCount[name]})` : name;

    seats.forEach(s => {
      if(!layoutLetters.has(s.replace(/^\d+/,''))) result.badSeats.push(s);
      if(result.pool.includes(s)) result.dupSeats.push(s);
      else result.pool.push(s);
    });

    const id = result.groups.length;
    const color = GROUP_COLORS[id % GROUP_COLORS.length];
    result.groups.push({
      id, name: display,
      short: name.length > 2 ? name.slice(-2) : name,
      count: seats.length,
      isLeader: leaderKeys.some(k => k && name.includes(k)),
      color, textColor: textColorFor(color)
    });
  });
  return result;
}

/* ========== 建立分數模型（預先算好，加快運算） ========== */
function pairScore(p1, p2){
  if(p1.r === p2.r){
    if(p1.b === p2.b && Math.abs(p1.idx - p2.idx) === 1) return 100;     // 同排緊鄰
    if(Math.abs(p1.b - p2.b) === 1){                                      // 隔走道
      const L = p1.b < p2.b ? p1 : p2, R = p1.b < p2.b ? p2 : p1;
      if(L.idx === blocksConfig[L.b].length - 1 && R.idx === 0) return 80;
    }
    return 20;
  }
  if(Math.abs(p1.r - p2.r) === 1){
    if(p1.c === p2.c) return 70;                                          // 前後排同位置
    if(p1.b === p2.b && Math.abs(p1.idx - p2.idx) === 1) return 40;       // 斜對角
    return 10;
  }
  return 0;
}
function buildModel(pool){
  const n = pool.length;
  const info = pool.map(s => {
    const r = parseInt(s,10), c = s.replace(/^\d+/,'');
    const loc = locate(c);
    return {id:s, r, c, b:loc.b, idx:loc.idx};
  });
  const aisle = info.map(p =>
    (p.b < blocksConfig.length - 1 && p.idx === blocksConfig[p.b].length - 1) || (p.b > 0 && p.idx === 0));
  const M = [];
  for(let i=0;i<n;i++) M.push(new Int32Array(n));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    M[i][j] = M[j][i] = pairScore(info[i], info[j]);
  }
  const indexOf = {};
  pool.forEach((s,i) => indexOf[s] = i);
  return {n, info, aisle, M, indexOf};
}

function groupScore(idxs, isLeader){
  let coh = 0, rowSum = 0, minRow = Infinity, hasAisle = false;
  for(let a=0;a<idxs.length;a++){
    const i = idxs[a];
    const r = model.info[i].r;
    rowSum += r;
    if(r < minRow) minRow = r;
    if(model.aisle[i]) hasAisle = true;
    for(let b=a+1;b<idxs.length;b++) coh += model.M[i][idxs[b]];
  }
  // 優先順序：領隊坐走道 > 每組都沒被拆開 > 領隊靠前排 > 坐得越緊越好 > 整體靠前
  let s = coh * 1000 - rowSum;
  if(isConnected(idxs)) s += 3000000;
  if(isLeader){
    if(hasAisle) s += 50000000;
    s -= minRow * 20000;
  }
  return s;
}

/* 這組是否全部相連（同排緊鄰／隔走道／前後排同位置都算） */
function isConnected(idxs){
  if(idxs.length < 2) return true;
  const seen = [idxs[0]];
  for(let k=0;k<seen.length;k++){
    const cur = seen[k];
    for(const nx of idxs){
      if(seen.indexOf(nx) === -1 && model.M[cur][nx] >= ADJ_THRESHOLD) seen.push(nx);
    }
  }
  return seen.length === idxs.length;
}

/* ========== 貪婪建立一組 ========== */
function buildBestCluster(avail, count, isLeader){
  let best = null, bestScore = -Infinity;
  for(const seed of avail){
    const cluster = [seed];
    const used = new Set([seed]);
    while(cluster.length < count){
      let bn = -1, bs = -Infinity;
      for(const c of avail){
        if(used.has(c)) continue;
        let add = 0;
        for(const s of cluster) add += model.M[s][c];
        if(add > bs){ bs = add; bn = c; }
      }
      if(bn < 0) break;
      cluster.push(bn); used.add(bn);
    }
    if(cluster.length < count) continue;
    const sc = groupScore(cluster, isLeader);
    if(sc > bestScore){ bestScore = sc; best = cluster; }
  }
  return best;
}

/* ========== 局部互換優化：兩組之間換位，總分變高就換 ========== */
function localImprove(assign){
  const owner = new Int32Array(model.n);
  const scores = [];
  groups.forEach(g => {
    assign[g.id].forEach(s => owner[s] = g.id);
    scores[g.id] = groupScore(assign[g.id], g.isLeader);
  });

  let improved = true, passes = 0;
  while(improved && passes < 30){
    improved = false; passes++;
    for(let i=0;i<model.n;i++){
      for(let j=i+1;j<model.n;j++){
        const gi = owner[i], gj = owner[j];
        if(gi === gj) continue;
        const A = assign[gi], B = assign[gj];
        const ai = A.indexOf(i), bj = B.indexOf(j);
        A[ai] = j; B[bj] = i;
        const nA = groupScore(A, groups[gi].isLeader);
        const nB = groupScore(B, groups[gj].isLeader);
        if(nA + nB > scores[gi] + scores[gj]){
          scores[gi] = nA; scores[gj] = nB;
          owner[i] = gj; owner[j] = gi;
          improved = true;
        }else{
          A[ai] = i; B[bj] = j;
        }
      }
    }
  }
  return scores.reduce((a,b) => a + b, 0);
}

/* ========== 主求解：多次隨機重啟 + 局部優化，有時間上限 ========== */
function solve(){
  const baseOrder = [...groups].sort((a,b) => (b.count - a.count) || (b.isLeader - a.isLeader));
  let bestAssign = null, bestScore = -Infinity;
  const t0 = performance.now();
  let iter = 0;

  while(iter === 0 || (performance.now() - t0 < SEARCH_TIME_MS && iter < 2000)){
    const order = [...baseOrder];
    if(iter > 0){
      for(let i=order.length-1;i>0;i--){
        if(Math.random() < 0.4){
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
      }
    }
    let avail = [...Array(model.n).keys()];
    const assign = [];
    let ok = true;
    for(const g of order){
      const cl = buildBestCluster(avail, g.count, g.isLeader);
      if(!cl){ ok = false; break; }
      assign[g.id] = cl;
      const set = new Set(cl);
      avail = avail.filter(x => !set.has(x));
    }
    if(ok){
      const total = localImprove(assign);
      if(total > bestScore){
        bestScore = total;
        bestAssign = assign.map(a => a.slice());
      }
    }
    iter++;
  }
  return bestAssign;
}

/* ========== 按鈕流程 ========== */
function startProcessing(){
  const btn = document.getElementById('processBtn');
  btn.innerText = "⏳ 分析中，請稍候...";
  btn.disabled = true;
  setTimeout(() => {
    try{ processSeats(); }
    finally{
      btn.innerText = "立即分配座位";
      btn.disabled = false;
    }
  }, 50);
}

function processSeats(){
  const raw = document.getElementById('inputData').value.trim();
  const layoutType = document.getElementById('layout').value;
  blocksConfig = LAYOUT_CONFIGS[layoutType];
  saveInputs();

  if(!raw){ showError("請輸入名單與座位！"); return; }

  const leaderKeys = document.getElementById('leaderKeys').value
    .split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
  const parsed = parseInput(raw, leaderKeys);

  if(parsed.pool.length === 0){ showError("找不到有效座位，請確認輸入格式（例如：王小明 16AB）"); return; }
  if(parsed.badSeats.length){
    showError(`❌ 這些座位不在所選機型裡：${[...new Set(parsed.badSeats)].join('、')}\n` + suggestLayouts(raw));
    return;
  }
  if(parsed.dupSeats.length){
    showError(`❌ 這些座位重複輸入了：${[...new Set(parsed.dupSeats)].join('、')}\n請修正後再分配。`);
    return;
  }

  groups = parsed.groups;
  seatPool = parsed.pool;
  model = buildModel(seatPool);

  const best = solve();
  if(!best){ showError("座位數量異常，請檢查。"); return; }

  seatToGroup = {};
  best.forEach((idxs, gid) => idxs.forEach(i => seatToGroup[seatPool[i]] = gid));

  history = [];
  selectedSeat = null;
  document.getElementById('undoBtn').disabled = true;
  document.getElementById('seatMapContainer').style.display = 'block';
  refreshAll();
}

/* ========== 檢查被拆開的組 ========== */
function findSplitGroups(){
  const byGroup = {};
  for(const s in seatToGroup){
    (byGroup[seatToGroup[s]] = byGroup[seatToGroup[s]] || []).push(model.indexOf[s]);
  }
  const split = new Set();
  for(const gid in byGroup){
    const idxs = byGroup[gid];
    if(idxs.length < 2) continue;
    const seen = new Set([idxs[0]]), stack = [idxs[0]];
    while(stack.length){
      const cur = stack.pop();
      for(const nx of idxs){
        if(!seen.has(nx) && model.M[cur][nx] >= ADJ_THRESHOLD){ seen.add(nx); stack.push(nx); }
      }
    }
    if(seen.size < idxs.length) split.add(Number(gid));
  }
  return split;
}

function refreshAll(){
  const split = findSplitGroups();
  renderVisualMap(split);
  updateTextOutput();
  updateStatus(split);
}

function updateStatus(split){
  const el = document.getElementById('status');
  const msgs = [];
  if(split.size){
    msgs.push(`⚠️ 被拆開：${[...split].map(id => groups[id].name).join('、')}`);
  }
  groups.filter(g => g.isLeader).forEach(g => {
    const onAisle = Object.keys(seatToGroup).some(s => seatToGroup[s] === g.id && model.aisle[model.indexOf[s]]);
    if(!onAisle) msgs.push(`⚠️ ${g.name} 不在走道位`);
  });
  el.style.display = 'block';
  if(msgs.length){
    el.className = 'status warn';
    el.innerText = msgs.join('\n') + '\n（可點選座位手動互換）';
  }else{
    el.className = 'status ok';
    el.innerText = '✅ 每組都坐在一起，領隊都在走道';
  }
}

/* ========== 畫座位圖 ========== */
function renderVisualMap(split){
  const seatMapDiv = document.getElementById('seatMap');
  seatMapDiv.innerHTML = '';
  const poolSet = new Set(seatPool);
  const rows = [...new Set(seatPool.map(s => parseInt(s,10)))].sort((a,b) => a - b);
  if(!rows.length) return;

  for(let r = rows[0]; r <= rows[rows.length-1]; r++){
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';

    blocksConfig.forEach((block, bIdx) => {
      const blockDiv = document.createElement('div');
      blockDiv.className = 'seat-block';

      block.forEach(letter => {
        const seatId = r + letter;
        const seatDiv = document.createElement('div');
        seatDiv.className = 'seat';
        seatDiv.dataset.seat = seatId;

        if(poolSet.has(seatId)){
          seatDiv.classList.add('valid-seat');
          const gid = seatToGroup[seatId];
          if(gid !== undefined){
            const g = groups[gid];
            seatDiv.innerText = g.short;
            seatDiv.classList.add('assigned');
            seatDiv.style.backgroundColor = g.color;
            seatDiv.style.color = g.textColor;
            seatDiv.title = `${seatId} - ${g.name}`;
            if(split.has(gid)) seatDiv.classList.add('split');
          }else{
            seatDiv.innerText = "+";
            seatDiv.title = `${seatId} - 空位`;
          }
          if(selectedSeat === seatId) seatDiv.classList.add('selected');

          seatDiv.addEventListener('click', handleTap);
          seatDiv.draggable = true;
          seatDiv.addEventListener('dragstart', handleDragStart);
          seatDiv.addEventListener('dragover', handleDragOver);
          seatDiv.addEventListener('drop', handleDrop);
          seatDiv.addEventListener('dragenter', function(){ this.classList.add('over'); });
          seatDiv.addEventListener('dragleave', function(){ this.classList.remove('over'); });
          seatDiv.addEventListener('dragend', handleDragEnd);
        }else{
          seatDiv.classList.add('invalid-seat');
          seatDiv.innerText = letter;
          seatDiv.title = "非名單內座位";
        }
        blockDiv.appendChild(seatDiv);
      });
      rowDiv.appendChild(blockDiv);

      if(bIdx < blocksConfig.length - 1){
        const aisleDiv = document.createElement('div');
        aisleDiv.className = 'aisle';
        aisleDiv.innerText = r;
        rowDiv.appendChild(aisleDiv);
      }
    });
    seatMapDiv.appendChild(rowDiv);
  }
}

/* ========== 文字結果 ========== */
function updateTextOutput(){
  const lists = groups.map(() => []);
  for(const s in seatToGroup) lists[seatToGroup[s]].push(s);

  const out = [];
  groups.forEach(g => {
    const rowMap = {};
    lists[g.id].forEach(s => {
      const row = parseInt(s,10);
      (rowMap[row] = rowMap[row] || []).push(s.replace(/^\d+/,''));
    });
    const parts = Object.keys(rowMap).sort((a,b) => a - b)
      .map(row => row + rowMap[row].sort().join(''));
    if(parts.length) out.push(`${g.name} ${parts.join(' ')}`);
  });
  document.getElementById('output').innerText = out.join('\n');
}

/* ========== 互換 / 復原 ========== */
function swapSeats(a, b){
  if(a === b) return;
  history.push(JSON.stringify(seatToGroup));
  if(history.length > 50) history.shift();
  document.getElementById('undoBtn').disabled = false;

  const ga = seatToGroup[a], gb = seatToGroup[b];
  if(gb === undefined) delete seatToGroup[a]; else seatToGroup[a] = gb;
  if(ga === undefined) delete seatToGroup[b]; else seatToGroup[b] = ga;
  refreshAll();
}
function undo(){
  if(!history.length) return;
  seatToGroup = JSON.parse(history.pop());
  selectedSeat = null;
  document.getElementById('undoBtn').disabled = history.length === 0;
  refreshAll();
}

/* 點選互換（手機好用） */
function handleTap(){
  const id = this.dataset.seat;
  if(selectedSeat === null){
    selectedSeat = id;
    refreshAll();
  }else if(selectedSeat === id){
    selectedSeat = null;
    refreshAll();
  }else{
    const from = selectedSeat;
    selectedSeat = null;
    swapSeats(from, id);
  }
}

/* 拖曳互換（電腦） */
function handleDragStart(e){
  draggedSeatId = this.dataset.seat;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedSeatId);
}
function handleDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function handleDrop(e){
  e.preventDefault(); e.stopPropagation();
  this.classList.remove('over');
  const target = this.dataset.seat;
  if(draggedSeatId && draggedSeatId !== target){
    selectedSeat = null;
    swapSeats(draggedSeatId, target);
  }
  draggedSeatId = null;
}
function handleDragEnd(){
  this.classList.remove('dragging');
  document.querySelectorAll('.seat.over').forEach(s => s.classList.remove('over'));
}

/* ========== 複製 ========== */
function copyResult(){
  const text = document.getElementById('output').innerText;
  if(!text || text === "等待計算..." || text.startsWith("❌") || text.startsWith("請輸入") || text.startsWith("找不到")){
    alert("目前沒有可以複製的結果唷！");
    return;
  }
  const done = () => {
    const btn = document.getElementById('copyBtn');
    btn.innerText = "✅ 已複製！";
    setTimeout(() => { btn.innerText = "📋 一鍵複製"; }, 2000);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy') ? done() : alert("複製失敗，請手動框選文字複製。"); }
    catch(e){ alert("複製失敗，請手動框選文字複製。"); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else{
    fallback();
  }
}

loadInputs();
</script>
